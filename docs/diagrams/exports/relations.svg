"277.113" font-family="Arial">Seule cascade SQL : animal -> dossier_medical</text><text x="430.5" y="820.741" fill="#000" font-size="13" textLength="278.129" font-family="Arial">ON DELETE CASCADE ; autres FK : restriction.</text><text x="430.5" y="835.69" fill="#000" font-size="13" textLength="273.133" font-family="Arial">SQL : 0..1 dossier ; Java impose exactement 1.</text></g><g class="entity" data-qualified-name="GMN15" id="ent0016" data-source-line="68"><path d="M30,785.099 L30,846.894 A4,4 0 0 0 34,850.894 L370.039,850.894 A4,4 0 0 0 374.039,846.894 L374.039,791.099 L364.039,781.099 L207.075,781.099 L205.176,714.27 L199.075,781.099 L34,781.099 A4,4 0 0 0 30,785.099" style="stroke:#BEA454;stroke-width:0.5;" fill="#FFF9E8"/><path d="M364.039,781.099 L364.039,789.099 A2,2 0 0 0 366.039,791.099 L374.039,791.099 L364.039,781.099" style="stroke:#BEA454;stroke-width:0.5;" fill="#FFF9E8"/><text x="36" y="798.292" fill="#000" font-size="13" textLength="198.561" font-family="Arial">statut : DEFAULT 'EN_ATTENTE'.</text><text x="36" y="813.241" fill="#000" font-size="13" textLength="251.812" font-family="Arial">telephone nullable en SQL, requis par l'API.</text><text x="36" y="828.19" fill="#000" font-size="13" textLength="323.039" font-family="Arial">Aucune contrainte SQL « une acceptation par animal » :</text><text x="36" y="843.139" fill="#000" font-size="13" textLength="270.969" font-family="Arial">règle assurée par transactions et verrous Java.</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk6" data-link-type="crowfoot"><line x1="530" y1="165.159" x2="538" y2="165.159" style="stroke:#526575;stroke-width:1;"/><line x1="530" y1="168.159" x2="538" y2="168.159" style="stroke:#526575;stroke-width:1;"/><line x1="534" y1="169.159" x2="534" y2="161.159" style="stroke:#526575;stroke-width:1;"/><line x1="534" y1="239.954" x2="540" y2="247.954" style="stroke:#526575;stroke-width:1;"/><line x1="534" y1="239.954" x2="528" y2="247.954" style="stroke