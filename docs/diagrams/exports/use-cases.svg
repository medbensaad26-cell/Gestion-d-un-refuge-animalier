787.47 739.988,787.85 836.856,788.017" style="stroke:#526575;stroke-width:1.3;" fill="none"/></g><g class="link" data-entity-1="ent0015" data-entity-2="ent0002" id="lnk34" data-link-type="association"><path d="M419.626,855.251 C547.438,836.789 746.322,808.059 836.796,794.99" style="stroke:#526575;stroke-width:1.3;" fill="none"/></g><g class="link" data-entity-1="ent0016" data-entity-2="ent0002" id="lnk35" data-link-type="association"><path d="M414.043,947.397 C517.103,930.27 673.245,897.732 800,843.099 C812.538,837.695 825.28,830.478 836.938,823.054" style="stroke:#526575;stroke-width:1.3;" fill="none"/></g><g class="link" data-entity-1="ent0017" data-entity-2="ent0002" id="lnk36" data-link-type="association"><path d="M427.153,1043.284 C534.984,1034.278 690.591,1006.995 800,927.099 C834.325,902.033 857.496,858.398 870.764,826.691" style="stroke:#526575;stroke-width:1.3;" fill="none"/></g><g class="link" data-entity-1="ent0018" data-entity-2="ent0002" id="lnk37" data-link-type="association"><path d="M768.089,616.128 C782.854,622.639 797.02,630.822 809,641.099 C842.208,669.586 862.644,716.298 873.74,749.413" style="stroke:#526575;stroke-width:1.3;" fill="none"/></g><g class="link" data-entity-1="ent0019" data-entity-2="ent0018" id="lnk38" data-link-type="dependency"><polygon points="547.843,568.682,539.812,562.98,542.942,567.693,538.229,570.822,547.843,568.682" fill="#526575" style="stroke:#526575;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M393.575,538.411 C432.506,545.909 478.507,554.843 520,563.099 C529.048,564.899 533.527,565.792 542.942,567.693" style="stroke:#526575;stroke-width:1.3;stroke-dasharray:7,7;" fill="none"/><text x="457" y="546.168" fill="#000" font-size="15" textLength="61.721" font-family="Arial">«extend»</text></g><g class="link" data-entity-1="ent0020" data-entity-2="ent0018" id="lnk39" data-link-type="dependency"><polygon points="547.891,591.407,538.88,587.432,542.891,591.421,538.903,595.432,547.891,591.407" fill="#526575" style="stroke:#526575;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M391.416,591.849 C438.825,591.715 492.658,591.563 542.891,591.421" style="stroke:#526575;stroke-width:1.3;stroke-dasharray:7,7;" fill="none"/><text x="457" y="586.168" fill="#000" font-size="15" textLength="61.721" font-family="Arial">«extend»</text></g><g class="legend" data-source-line="48"><rect x="79.777" y="1137.099" width="783.445" height="122.69" fill="none" style="stroke:#000;stroke-width:1;" rx="4" ry="4"/><text x="84.777" y="1155.23" fill="#000" font-size="14" textLength="622.645" font-family="Arial">Les cas de gestion et la déconnexion exigent une session valide ; la connexion est une précondition,</text><text x="84.777" y="1171.329" fill="#000" font-size="14" textLength="558.038" font-family="Arial">pas une authentification à répéter à chaque action. Le visiteur ne possède pas de compte.</text><text x="84.777" y="1187.428" fill="#000" font-size="14" textLength="589.887" font-family="Arial">Extensions : détail depuis le catalogue ; recherche/filtre facultatifs ; décision après consultation.</text><text x="84.777" y="1203.526" fill="#000" font-size="14" textLength="705.838" font-family="Arial">Annonces publiques : PUBLIEE uniquement. Nouvelle demande : EN_ATTENTE, affectée au seul admin existant.</text><text x="84.777" y="1219.625" fill="#000" font-size="14" textLength="773.445" font-family="Arial">Accepter : demande EN_ATTENTE et animal disponible -> ACCEPTEE + ADOPTE (transaction). Refuser : animal inchangé.</text><text x="84.777" y="1235.724" fill="#000" font-size="14" textLength="680.955" font-family="Arial">Médical : création explicite si dossier absent, pas de suppression indépendante. Animaux : historique protégé.</text><text x="84.777" y="1251.822" fill="#000" font-size="14" textLength="495.25" font-family="Arial">Publier / retirer : PUBLIEE / INTERNE ; aucun écran de suppression d'annonce.</text></g></g></svg>